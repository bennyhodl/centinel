# Watch YAML template — copy to <wiki>/Watches/<id>.yaml and tune.
#
# Each watch is a single YAML file. Filename stem = id.
# Watches are versioned in git; YAML diffs are the audit trail.

# REQUIRED ----------------------------------------------------------------

id: my-watch                    # slug; matches filename
title: Human-readable watch title

# Type determines evaluation path AND classification lane:
#   data       → SQL/structured rule; can produce raw findings (with auto_publish)
#   narrative  → prose rule, LLM-evaluated; ALWAYS draft regardless of auto_publish
type: data

# Match block — sieve over the latest sitemap diff.
# All fields AND together. See references/match-dsl.md.
match:
  type: [contracts]             # sitemap entry types
  url_pattern: "/procurement/.*"  # regex (or glob:*pattern* for fnmatch)
  change: [added, changed]      # added | changed | broken | any
  # content_kind: [document]    # optional
  # value_threshold:            # DB-joined; data watches only
  #   field: transactions.amount_usd
  #   op: ">"
  #   value: 100000
  # new_only: true              # shorthand for change:[added]
  # entity_in: [acme-construction]

# Rule — evaluated against each candidate.
# For data: SQL run against tampa.db, with :since bound to last_run.
# For narrative: prose criterion, LLM evaluates, requires verbatim quote.
rule: |
  SELECT t.id, t.amount_usd, e.canonical_name AS contractor,
         t.txn_date, t.contract_ref, t.source_url
  FROM transactions t
  JOIN entities e ON e.id = t.to_id
  WHERE t.txn_date >= :since
    AND t.amount_usd > 100000
    AND t.contract_method = 'no-bid'

severity: medium                # low | medium | high (informational only;
                                # gating is decided by classification rubric)

auto_publish: false             # true → data hits with citation can go RAW.
                                # narrative hits ALWAYS go draft regardless.

paused: false                   # true → runner skips this watch entirely

max_hits_per_run: 25            # safety cap; overflow auto-pauses watch
                                # and emits a tuning request to Editor

# OPTIONAL ----------------------------------------------------------------

confidence_min: 0.6             # narrative watches only; minimum LLM
                                # confidence to even reach the draft folder

finding_template: |             # optional Jinja-ish template for finding body;
                                # falls back to templates/finding-raw.md if absent
  # {watch_title}: {contractor} — ${amount_usd:,.0f}
  - **Date:** {txn_date}
  - **Contract:** {contract_ref}
  - **Source:** [[{source_vault_path}]] · {source_url}

notes: |
  Free-form rationale for the operator. Why does this watch exist?
  What's the threshold tuning history? What's the expected hit rate?
  This block is the README of this watch — the Editor and operator both
  read it when deciding whether to tune.

