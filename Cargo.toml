[workspace]
resolver = "3"
members = [
    "crates/centinel-core",
    "crates/centinel-macros",
    "crates/centinel",
    # Links whisper.cpp, and must never link llama.cpp — see the crate's Cargo.toml.
    "crates/centinel-whisper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/bennyhodl/centinel"

[workspace.dependencies]
centinel-core = { path = "crates/centinel-core" }
centinel-macros = { path = "crates/centinel-macros" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "string", "env"] }
inventory = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-std", "io-util", "process"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
axum = "0.8"
tokio-stream = "0.1"
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
