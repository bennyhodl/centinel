[workspace]
resolver = "3"
members = [
    "crates/centinel-core",
    "crates/centinel-macros",
    "crates/centinel",
    # Links whisper.cpp, and must never link llama.cpp — see the crate's Cargo.toml.
    "crates/centinel-whisper",
]

[workspace.package]
version = "0.12.2"
edition = "2024"
# Set by LanceDB, which is the only dependency that asks for more than edition 2024's
# 1.85. Holding 1.85 would hold LanceDB at 0.23 — ten releases back — to keep a floor
# no CI job tests against.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/bennyhodl/centinel"

# `cargo install` builds this profile, so what is set here is what a person actually runs.
#
# Two things are deliberately absent. `panic = "abort"` would be wrong in a tool whose run
# report distinguishes a stage that failed from a corpus that had nothing: a process that
# aborts cannot unwind to record its Underivables, and work that was attempted and not
# recorded is work every later run attempts again. `strip` would buy little on a binary
# already dominated by two vendored C++ libraries, and it costs the function names in the
# one backtrace somebody eventually sends us.
[profile.release]
# Thin rather than fat. The win is in this workspace's own whole-corpus loops — chunking,
# hashing, the FTS5 write path — and fat LTO pays for that across arrow, datafusion and
# lancedb, which is most of the link on a build people already complain about the length of.
lto = "thin"

[workspace.dependencies]
centinel-core = { path = "crates/centinel-core" }
centinel-macros = { path = "crates/centinel-macros" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
clap = { version = "4", features = ["derive", "string", "env"] }
inventory = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-std", "io-util", "process", "signal", "time"] }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
axum = "0.8"
tokio-stream = "0.1"
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
