# git-cliff — the changelog is read off the commits, so the commit subject is the
# release note. Conventional prefixes are what make that work; anything without one is
# dropped rather than guessed at.

[changelog]
header = """
# Changelog

What changed in each release, read from the commits. Generated by `git cliff` —
edit the commit, not this file.\n
"""
# Groups are numbered in an HTML comment so they sort in the order declared below and
# not alphabetically. `striptags` takes the number back off for the heading.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}
{% endfor %}
{% endfor %}"""
trim = true
footer = ""

[git]
conventional_commits = true
# A commit with no conventional prefix is not a release note. This also drops merge
# commits and everything from the pre-Rust lineage.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = false
split_commits = false
topo_order = false
sort_commits = "oldest"

# The three sections asked for, plus perf — which is user-visible and would otherwise
# be silently dropped. git-cliff omits a group with no commits, so a release with no
# breaking change prints no "API changes" heading.
#
# Order matters: the first parser that matches wins, so the breaking rules come first.
# A `feat!` is an API change before it is a feature.
commit_parsers = [
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 0 -->API changes" },
  # `footer`, not `body`: a conventional commit puts `BREAKING CHANGE:` in the trailers,
  # so a body matcher never sees it and the change is filed as an ordinary refactor.
  { footer = "^BREAKING[ -]CHANGE:", group = "<!-- 0 -->API changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  # docs, test, chore, refactor, style, ci. Real work, and not what a release is read
  # for — `git log` still holds them.
  { message = ".*", skip = true },
]

# A regex, not a glob. `v0.1.0-hermes` and `v0.2.0-pi` mark two architectural lineages
# rather than releases of this workspace, and matching them would bound every changelog
# at the wrong commit.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
