[package]
name = "centinel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Centinel's library core: domain model, content-addressed store, and the op registry."

[dependencies]
centinel-macros.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
inventory.workspace = true
# `net` for `inference`'s reachability check — a TCP connect, before a stage commits to an
# hour of work against a server that is not there.
tokio = { workspace = true, features = ["net"] }
futures.workspace = true
sha2.workspace = true
hex.workspace = true
# `download` returns blob bytes through a JSON report, and JSON has no bytes — only
# strings. Already in the tree under reqwest, so declaring it adds no crate.
base64 = "0.22"
jiff.workspace = true
tracing.workspace = true
# Column alignment measured in display cells rather than bytes or chars — a CJK title in
# a table would otherwise shift every column to its right.
unicode-width = "0.2"
reqwest.workspace = true
texting_robots = "0.2.2"
roxmltree = "0.21.1"
flate2 = "1.1.9"
url = "2.5.8"
governor = "0.10.4"
htmd = "0.5.5"
# htmd's own DOM types, so `extract` can render a `<table>` itself. Pinned to the version
# htmd re-exports `Node` from: a different one compiles and then fails to unify, because
# the handler is handed htmd's `Rc<Node>` and would be reading a second crate's.
markup5ever_rcdom = "=0.38.0"
dom_smoothie = "0.18.0"
# CSS selectors, for the `marked` read strategy to find a page's own content region.
# Already in the tree as dom_smoothie's own dependency, so this adds no crate — it is
# declared because `strategies::read::marked` uses it directly, and an undeclared
# transitive dependency breaks the day dom_smoothie changes its mind.
dom_query = "0.28.0"
pdf-inspector = "0.1.7"
# Office formats, and only those. PDFs stay on `pdf-inspector` directly: anydoc wraps the
# same crate but collapses its result to a `String`, and `pages_needing_ocr` is the whole
# reason a 300-page budget with two scanned exhibits still yields 298 searchable pages.
anydoc = "0.1.3"
# Held at anydoc's requirement so one copy of calamine is in the tree, not two.
calamine = "0.36.1"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "1.1.4"
# yt-dlp writes files and the store wants bytes; each video gets a scratch directory
# that is removed with it, so nothing outlives the conversion.
tempfile = "3"

# ANN over the embedding cache (SPEC §5.1). Its default features are the S3, GCS, Azure
# and OSS object stores — every one of them a network path out of a machine that §2.1
# says nothing leaves. Local tables need none of them.
lancedb = { version = "0.33.0", default-features = false }
# `VectorTable::repair` drops an unreadable fragment from the table's manifest. That is a
# raw Lance transaction, and lancedb exposes no delete-by-fragment-id. Pinned to the exact
# version lancedb already requires, so this names a crate that is in the tree rather than
# adding a second copy of it; `default-features = false` for the same reason as lancedb
# above: the defaults are the object stores this machine never talks to.
lance = { version = "=9.0.0", default-features = false }

[dev-dependencies]
tempfile = "3"
# A capturing subscriber for the tests of `op::log_event`, which is where a progress
# event becomes a log line. The binary installs the real one.
tracing-subscriber.workspace = true
# Office documents are built in the tests rather than committed as fixtures, matching how
# the rest of this crate tests: the input is readable beside the assertion. Already in the
# tree through anydoc, so it costs no build time.
zip = "8"

# The pid-liveness check behind `run.lock`'s stale-lock recovery, and nothing else.
# Already in the tree under tokio, so this costs no new download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
