[package]
name = "centinel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Centinel's library core: domain model, content-addressed store, and the op registry."

[dependencies]
centinel-macros.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
inventory.workspace = true
tokio.workspace = true
futures.workspace = true
sha2.workspace = true
hex.workspace = true
jiff.workspace = true
tracing.workspace = true
reqwest.workspace = true
texting_robots = "0.2.2"
roxmltree = "0.21.1"
flate2 = "1.1.9"
url = "2.5.8"
governor = "0.10.4"
htmd = "0.5.5"
dom_smoothie = "0.18.0"
pdf-inspector = "0.1.7"
calamine = "0.35.0"
rusqlite = { version = "0.37", features = ["bundled"] }
toml = "1.1.4"
# yt-dlp writes files and the store wants bytes; each video gets a scratch directory
# that is removed with it, so nothing outlives the conversion.
tempfile = "3"

# Local inference. Compiles llama.cpp from source, which is what puts a C++ build in
# `cargo build` — the distribution question ticket #11 already tracks for whisper-rs.
llama-cpp-2 = { version = "0.1.153", default-features = false, features = ["openmp"] }

[features]
default = []
# GPU backends. Metal is enabled automatically on macOS below; the rest are opt-in
# because they need a toolchain (nvcc, ROCm) that a plain `cargo build` cannot assume.
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
rocm = ["llama-cpp-2/rocm"]

# Metal needs no external toolchain on macOS and is the difference between a corpus that
# embeds overnight and one that embeds over a lunch break, so it is not opt-in there.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.153", default-features = false, features = ["openmp", "metal"] }

[dev-dependencies]
tempfile = "3"
# The download tests speak HTTP/1.1 over a raw socket. Resume correctness is a property
# of the conversation — Range headers, 206 vs 200, a connection dropped mid-body — and a
# server framework will not let a test write a deliberately truncated response.
tokio = { workspace = true, features = ["net"] }
