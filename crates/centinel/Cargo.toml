[package]
name = "centinel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Centinel: a data-collection toolkit for .gov web surfaces and YouTube channels."
default-run = "centinel"

[dependencies]
centinel-core.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
jiff.workspace = true
axum.workspace = true
tokio-stream.workspace = true
reqwest.workspace = true
async-stream = "0.3"
getrandom = "0.3"
sha2.workspace = true
# Terminal size only, for fitting a rendered report. Already in the tree under dialoguer,
# so this costs no new download.
console = "0.16"
# The `schedule set` wizard and the `investigate` confirmation. Built on `console`; the
# better-known `inquire` sits on crossterm, and two terminal libraries deciding
# independently about raw mode and cursor position is a class of bug nobody wants.
dialoguer = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# `setpriority` for the scheduler's threads — collection is throughput work and search is
# latency work. Already in the tree under tokio, so this costs no new download.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
