# Prebuilt binaries for a released tag, so that installing is a download rather than a
# twenty-minute build. Three assets, one binary in each:
#
#   centinel-aarch64-apple-darwin.tar.gz       Apple Silicon
#   centinel-x86_64-unknown-linux-gnu.tar.gz   x86-64-v3 — AVX2, any x86_64 since ~2013
#   centinel-aarch64-unknown-linux-gnu.tar.gz  arm64 Linux, the DGX Spark included
#
# None of them carries a GPU backend, because none of them runs a model: embedding,
# reranking and transcription are requests to the servers `[inference]` names, and the
# GPU is theirs. So one asset per platform serves every host on it.
#
# ALL ARE ON. `release.yml` calls this on every release and every asset builds each
# time. The `macos` input is the skip switch: untick it on a hand-started run and only
# the Linux assets build.
#
# `workflow_dispatch` takes the same inputs. A hand-started run builds and uploads against
# any tag that already exists, which is how to backfill a release that shipped without
# assets.
name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      macos:
        description: "Build the aarch64-apple-darwin asset (untick to skip)"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload assets for, as vX.Y.Z"
        required: true
        type: string
      macos:
        description: "Build the aarch64-apple-darwin asset (untick to skip)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# Two runs uploading to one tag would race over the same asset name.
concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Its own job rather than a row of the Linux matrix, because the `macos` switch has to
  # skip it and a job's `if` cannot see the matrix.
  macos:
    name: aarch64-apple-darwin
    if: ${{ inputs.macos }}
    # Pinned, because the image decides the oldest macOS the asset will start on, and
    # `macos-latest` would move that floor under everybody who downloads without anybody
    # choosing to. A host below the floor is not stranded: the installer runs the binary
    # before it keeps it, and builds when it will not start.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # protoc is lance's, through prost-build, and no crate in the tree vendors it.
      # Homebrew's protobuf is the compiler and the well-known types together.
      - name: install protoc
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: build web workspace
        run: |
          npm ci
          npm run build

      # No target-cpu. rustc's default for aarch64-apple-darwin is already apple-m1, so
      # the asset runs on every Apple Silicon Mac as built.
      - name: build centinel
        run: cargo build --release --locked -p centinel

      - name: package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ASSET: centinel-aarch64-apple-darwin.tar.gz
        run: |
          set -euo pipefail
          tar -czf "$ASSET" -C target/release centinel
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  linux:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned for the same reason as the macOS image: it decides the oldest glibc the
          # asset will start on.
          #
          # x86-64-v3 is AVX2, FMA, F16C and BMI2 — every x86_64 since about 2013 — and the
          # installer refuses this asset on a CPU without AVX2 rather than letting it fault.
          # arm64 builds for armv8-a, the baseline of the architecture.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            rustflags: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # Debian splits protoc from the well-known types, and lance imports the types.
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: build web workspace
        run: |
          npm ci
          npm run build

      - name: build centinel
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p centinel

      - name: package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          ASSET: centinel-${{ matrix.target }}.tar.gz
        run: |
          set -euo pipefail
          tar -czf "$ASSET" -C target/release centinel
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
